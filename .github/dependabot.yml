version: 2
updates:
  # Workspace dev-tooling (rollup, eslint, prettier, typescript, changesets…).
  # Runtime deps are almost all @exortek/* workspace packages, so this mostly
  # tracks the build/lint toolchain. Grouped into one PR to keep the noise low.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']
    ignore:
      # TypeScript 7 is a breaking major the toolchain isn't ready for: the docs
      # site's twoslash transformer (via nextra / @shikijs/twoslash) peers on
      # `^5.5.0 || ^6.0.0` and hard-fails the web build on TS 7. Don't let
      # Dependabot keep proposing it. Patch/minor bumps still come through.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Keep the CI / CodeQL action pins current.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
