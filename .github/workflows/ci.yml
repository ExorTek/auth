name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      # Build every package's dist first. Packages import their
      # @exortek/* workspace deps from the built dist/*.mjs (jwks → jwk,
      # passkey → challenge / crypto, session → crypto, …); on a fresh
      # checkout dist/ is absent (gitignored), so without this the
      # cross-package tests fail with ERR_MODULE_NOT_FOUND.
      - run: yarn build
      - run: yarn verify
