name: CI

on:
  workflow_dispatch: # manual run: Actions tab → CI → "Run workflow", or `gh workflow run ci.yml`
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Decide whether this change touches code/config. Docs-only changes
      # (READMEs, AGENTS.md, web/, docs/, .changeset/) don't need the full
      # build + test — but the job must still run and report, because branch
      # protection requires this check. So we always run, and skip the heavy
      # steps below when nothing code-relevant changed.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'packages/**'
              - '!packages/**/*.md'
              - '.github/workflows/**'
              - 'package.json'
              - 'yarn.lock'
              - 'tsconfig*.json'
              - 'rollup.config*.js'
              - '.prettierrc*'
              - 'eslint.config*'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable

      # Full pipeline when code/config changed. `yarn build` first: packages
      # import their @exortek/* workspace deps from the built dist/*.mjs
      # (jwks → jwk, passkey → challenge / crypto, …), which is gitignored and
      # absent on a fresh checkout, so tests would otherwise fail with
      # ERR_MODULE_NOT_FOUND.
      # `REDIS_URL` switches on the `*.integration.test.js` suites, which are
      # skipped without it. They exercise the client boundary the fake-client
      # unit tests cannot reach — real Lua, real SET-with-TTL, real SCAN — and
      # each one runs against both `ioredis` and `node-redis`, because the two
      # drivers take those arguments differently.
      - name: Verify (build + typecheck + lint + format + test)
        if: steps.changes.outputs.code == 'true'
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          yarn build
          yarn verify

      # Docs-only change: just keep the repo prettier-clean. Fast, and the
      # required check still reports success so the PR can merge.
      - name: Format check only (docs-only change)
        if: steps.changes.outputs.code != 'true'
        run: yarn format:check
