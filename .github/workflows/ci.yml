name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      # Run test files serially on the 2-core runner: the default
      # per-CPU parallelism starves the event loop and makes the
      # real-timer tests (security rate-limit / slow-down / timeout)
      # miss their deadlines, cascading into cancellations.
      - run: node --test --test-concurrency=1 'packages/*/tests/**/*.test.js'
