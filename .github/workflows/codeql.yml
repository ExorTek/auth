name: CodeQL

on:
  workflow_dispatch: # manual run: Actions tab → CodeQL → "Run workflow", or `gh workflow run codeql.yml`
  push:
    branches: [master]
    # Skip the run entirely for changes that touch no analysed source. What is
    # actually SCANNED is scoped in .github/codeql/codeql-config.yml (only
    # packages/*/src) — this list just avoids spinning up the job for docs,
    # changesets, examples, and the docs site.
    paths-ignore: &docs-only
      - '**/*.md'
      - 'docs/**'
      - 'web/**'
      - '.changeset/**'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'packages/**/examples/**'
  pull_request:
    branches: [master]
    paths-ignore: *docs-only
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # Scope analysis to shipped library source (packages/*/src) so tests,
          # examples, dist, the docs site, and tooling are never reported on.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
