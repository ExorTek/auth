name: Release

# Manual publish. Versions are bumped beforehand through a normal
# "chore: version packages" PR (yarn changeset:ver → commit → PR → merge);
# this workflow only builds, publishes to npm, tags, and cuts GitHub
# Releases for whatever versions currently sit on master. Trigger it from
# Actions → Release → "Run workflow", or `gh workflow run release.yml`.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + pack only, do not publish or tag'
        type: boolean
        default: false

permissions:
  contents: write # push tags + create GitHub Releases
  id-token: write # OIDC — npm Trusted Publishing (no stored token) + provenance

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build

      # Auth is OIDC Trusted Publishing — no NPM_TOKEN. Configure a trusted
      # publisher for each @exortek/* package on npmjs.com first (repo
      # ExorTek/auth, workflow release.yml). Yarn detects the GitHub OIDC
      # environment automatically when id-token:write is granted and no auth
      # token is set. YARN_NPM_PUBLISH_PROVENANCE attaches build provenance.
      - name: Publish to npm (OIDC Trusted Publishing + provenance)
        if: ${{ !inputs.dry_run }}
        env:
          YARN_NPM_PUBLISH_PROVENANCE: 'true'
        run: |
          yarn workspaces foreach --all --topological --no-private npm publish --tolerate-republish --access public

      # Tag each just-published package and cut a GitHub Release for it, with
      # its CHANGELOG entry as the notes. `gh release create` creates AND pushes
      # the tag atomically — `changeset tag` + `git push --tags` silently pushed
      # nothing in CI ("Everything up-to-date"), leaving the Releases page empty.
      # Idempotent: a package whose release already exists is skipped, so
      # re-runs and unchanged packages are no-ops. `@exortek/shared` is private
      # and skipped.
      - name: Tag + cut GitHub Releases
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          for dir in packages/*/; do
            name=$(node -p "try{require('./${dir}package.json').name}catch{''}")
            [ -z "$name" ] && continue
            private=$(node -p "try{require('./${dir}package.json').private?'y':'n'}catch{'y'}")
            [ "$private" = "y" ] && continue
            ver=$(node -p "require('./${dir}package.json').version")
            tag="${name}@${ver}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "skip (exists): $tag"; continue
            fi
            notes=$(mktemp)
            awk '/^## /{c++} c==1{print} c==2{exit}' "${dir}CHANGELOG.md" > "$notes" 2>/dev/null || true
            [ -s "$notes" ] || echo "Release $tag" > "$notes"
            gh release create "$tag" --target "$sha" --title "$tag" --notes-file "$notes"
            rm -f "$notes"
            echo "created: $tag"
          done

      - name: Dry-run notice
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true — built only, nothing published or tagged."
